model:
  embed_dim: 32
  vocab_size: 2048
  max_context_window: 64
  num_layers: 5
  tied_embeddings: false
  attention:
    num_q_heads: 1
    num_kv_heads: 1
    rope_theta: 10000.0
  ffn:
    use_gate: true
    mlp_to_embed_expand_factor: 4
    MoE_num_experts: 1            # 1 = dense
    MoE_num_experts_per_tkn: 1
    MoE_capacity_factor: 1.25
    MoE_router_aux_loss_coef: 0.01
    MoE_router_z_loss_coeff: 0.0

data:
  train_path: ../data/tokenized-2048-train-tinyStories-10Mb.bin
  val_path: ../data/tokenized-2048-valid-tinyStories-1Mb.bin

train:
  run_name: l3_dense_s42_compiled
  run_root: ../runs
  total_steps: 3000
  batch_size: 16
  lr: 0.001
  seed: 42
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_steps: 100
  min_lr_ratio: 0.1
  amp: none                       # none | fp16 | bf16
  eval_every: 50
  eval_batches: 50
  log_every: 10
  checkpoint_every: 250
  keep_last_n: 3